version: '3.3'
services:
  db-prod:
    image: "mysql:8.0.2"
    volumes:
      - /var/lib/mysql/weblabs-prod:/var/lib/mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=s;:NkTR^-EE5K9fV
      - MYSQL_USER=weblabs_app
      - MYSQL_PASSWORD=<(H9XA&qGW
      - MYSQL_DATABASE=weblabs_app
    network_mode: bridge

  redis-prod:
    image: "redis:6"
    command: >
      --requirepass Kg&k2Ce/u^
    volumes:
      - ./database/redis:/data
    ports:
      - "6378:6379"
    network_mode: bridge

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    working_dir: /app
    command: php artisan serve --host=0.0.0.0
    ports:
      - "1003:8000"
    env_file:
      - .env.prod
    network_mode: bridge
    links:
      - db-prod
      - redis-prod
