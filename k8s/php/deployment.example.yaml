apiVersion: v1
kind: Pod
metadata:
  name: test-php
  namespace: dev
spec:
  imagePullSecrets: regkeyname # (kind: secret)
  containers:
    - name: test-php
      image: php:7.4-cli
      command: [php, "test-file.php"] # command to execute once container is up (optional)
      resources:
        limits:
          memory: "128Mi"
          cpu: "500m"
      volumeMounts:
        - mountPath: /app
          name: test-php-volume
      workingDir: /app
      stdin: true
      tty: true
      imagePullPolicy: Always / Never / IfNotPresent
  restartPolicy: Never
  volumes:
    - name: test-php-volume
      hostPath:
        path: /tmp/test-user