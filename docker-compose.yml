version: '3.3'
services:
  db:
    image: "mysql:8.0.2"
    volumes:
      - ${DB_PATH_MAPPING}:/var/lib/mysql
    network_mode: bridge

  redis:
    image: "redis:6"
    command: >
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${REDIS_PATH_MAPPING}:/data
    network_mode: bridge

  app:
    build:
      context: .
    working_dir: /app
    image: weblabs-app
    command: php artisan serve --host=0.0.0.0
    env_file:
      - .env.dev
    network_mode: bridge
    depends_on:
      - db
      - redis

