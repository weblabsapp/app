services:
  db:
    image: "mysql:8.0.2"
    container_name: weblabs-dev-db
    volumes:
      - mysql-dev:/var/lib/mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      TZ: ${APP_TIMEZONE}
    ports:
      - 127.0.0.1:${DB_PORT}:3306
    network_mode: bridge

  redis:
    image: "redis:6"
    container_name: weblabs-dev-redis
    command: >
      --requirepass ${REDIS_PASSWORD}
    env_file: .env
    volumes:
      - redis-dev:/data
    ports:
      - 127.0.0.1:${REDIS_PORT}:6379
    network_mode: bridge

  app:
    build:
      context: .
    working_dir: /app
    image: weblabs-app-dev
    command: php artisan serve --host=0.0.0.0
    container_name: weblabs-dev-app
    ports:
      - 127.0.0.1:${APP_PORT}:8000
    volumes:
      - .:/app
      - /app/vendor
    env_file: .env
    network_mode: bridge
    extra_hosts:
      - k8s-virtual-machine.local:192.168.100.36
    depends_on:
      - db
      - redis

  queue:
    volumes:
      - .:/app
      - /app/vendor
    working_dir: /app
    image: weblabs-app-dev
    command: php artisan queue:work
    container_name: weblabs-dev-queue
    env_file: .env
    network_mode: bridge
    restart: always
    depends_on:
      - db
      - redis

volumes:
  mysql-dev:
    driver: local
  redis-dev:
    driver: local
