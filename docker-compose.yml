services:
  db:
    image: "mysql:8.0.2"
    container_name: weblabs-dev-db
    volumes:
      - mysql-dev:/var/lib/mysql
    ports:
      - "3308:3306"
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      TZ: ${APP_TIMEZONE}
    network_mode: bridge

  redis:
    image: "redis:6"
    container_name: weblabs-dev-redis
    command: >
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-dev:/data
    ports:
      - "6378:6379"
    network_mode: bridge

  app:
    build:
      context: .
    working_dir: /app
    image: weblabs-app:dev
    command: php artisan serve --host=0.0.0.0
    container_name: weblabs-dev-app
    ports:
      - "1004:8000"
    volumes:
      - .:/app
      - /app/vendor
    env_file:
      - .env
    network_mode: bridge
    depends_on:
      - db
      - redis

volumes:
  mysql-dev:
    driver: local
  redis-dev:
    driver: local