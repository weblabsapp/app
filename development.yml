version: '3.3'
services:
  db:
    volumes:
      - ${DB_PATH_MAPPING}:/var/lib/mysql
    ports:
      - "3308:3306"

  redis:
    command: >
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${REDIS_PATH_MAPPING}:/data
    ports:
      - "6378:6379"

  app:
    ports:
      - "1004:8000"
    volumes:
      - .:/app
      - /app/vendor
    env_file:
      - .env.dev
