version: '3.3'
services:
  db:
    container_name: weblabs-prod-db
    ports:
      - "3307:3306"
    restart: always

  redis:
    container_name: weblabs-prod-redis
    ports:
      - "6377:6379"
    restart: always

  app:
    container_name: weblabs-prod-app
    ports:
      - "1003:8000"
    env_file:
      - .env.prod
    restart: always
